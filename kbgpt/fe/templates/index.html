<!DOCTYPE html>
<html>
  <head>
    <title>Chat Interface</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        background-color: #f5f5f5;
      }
      #chat {
        border: 1px solid #ccc;
        background-color: #fff;
        padding: 10px;
        width: 500px;
        height: 400px;
        overflow-y: scroll;
        margin-bottom: 10px;
        font-size: 14px;
      }
      #userInput {
        width: 400px;
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
      }
      #sendButton {
        padding: 5px 10px;
        border: none;
        background-color: #007bff;
        color: #fff;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
      }
      #sendButton:hover {
        background-color: #0056b3;
      }
      .message {
        margin: 5px 0;
        clear: both;
        overflow: hidden;
        position: relative;
        padding: 10px;
        border-radius: 10px; /* 调整边框半径为10px */
        max-width: 80%;
        white-space: pre-wrap;
      }
      .user {
        color: #007bff;
        float: left;
        background-color: #e6f2ff;
      }
      .user::before {
        content: "User";
        position: absolute;
        top: -15px;
        left: 10px;
        font-size: 10px;
        color: #666;
      }
      .bot {
        color: #28a745;
        float: right;
        background-color: #e6ffe6;
      }
      .bot::before {
        content: "Bot";
        position: absolute;
        top: -15px;
        right: 10px;
        font-size: 10px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="chat"></div>
    <input
      type="text"
      id="userInput"
      placeholder="Type your message..."
      onkeypress="handleKeyPress(event)"
    />
    <button id="sendButton" onclick="sendMessage()">Send</button>

    <script>
      const socket = new WebSocket("ws://8.219.164.131:12345/ws");
      socket.onopen = () => {
        console.log("WebSocket connection opened.");
        appendMessage("Bot", "What can I help you?");
      };

      socket.onmessage = (event) => {
        const message = event.data;
        console.log("Received message:", message);
        appendMessage("Bot", message);
      };

      socket.onclose = () => {
        console.log("WebSocket connection closed.");
      };

      socket.onerror = (error) => {
        console.error("WebSocket error:", error);
      };
      function appendMessage(sender, message) {
        const chat = document.getElementById("chat");
        const newMessage = document.createElement("div");
        newMessage.textContent = message;
        newMessage.classList.add("message");
        if (sender === "User") {
          newMessage.classList.add("user");
        } else {
          newMessage.classList.add("bot");
        }
        chat.appendChild(newMessage);
        chat.scrollTop = chat.scrollHeight; // 自动下滑
      }

      function sendMessage() {
        const userInput = document.getElementById("userInput");
        const message = userInput.value;
        userInput.value = "";

        appendMessage("User", message);
        socket.send(message);
      }

      function handleKeyPress(event) {
        if (event.keyCode === 13) {
          // 按下回车键
          sendMessage();
        }
      }
    </script>
  </body>
</html>
