[tool.poetry]
name = "kbgpt"
version = "0.1.0"
description = ""
authors = ["Vince <vince@surfin.sg>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
langchain = "0.0.144"
openai = "^0.27.2"
bs4 = "^0.0.1"
lxml = "^4.9.2"
tiktoken = "^0.3.3"
unstructured = "^0.5.9"
redis = "^4.5.4"
requests = "^2.28.2"
pymysql = "^1.0.3"
pymysqldb = "^0.0.2"
pyyaml = "^6.0"
pypdf = "^3.7.0"
mysqlclient = "^2.1.1"
sanic = "^23.3.0"
pinecone-client = "^2.2.1"
chromadb = "0.3.21"
mergedeep = "^1.3.4"
py-apollo = "^0.0.3"
aioredis = "^2.0.1"
more-itertools = "^9.1.0"
tenacity = "^8.2.2"

[tool.poetry.dev-dependencies]
pylint = "*"


[tool.poetry.group.dev.dependencies]
pyramid = "^2.0.1"
black = "^23.3.0"
pytest = "^7.3.1"
pytest-asyncio = "^0.21.0"
pytest-sanic = "^1.9.1"
sanic-testing = "^23.3.0"



[[tool.poetry.source]]
name = "ali"
url = "http://mirrors.aliyun.com/pypi/simple/"
default = true
secondary = false

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = ["pydantic"]
ignored-modules = ["redis"]
disable=[
  'no-name-in-module'
]
ignored-classes=["Redis"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
