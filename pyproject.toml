[tool.poetry]
name = "kbgpt"
version = "0.1.0"
description = ""
authors = ["Vince <vince@surfin.sg>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
langchain = "0.0.172"
openai = "^0.27.2"
bs4 = "^0.0.1"
lxml = "^4.9.2"
tiktoken = "^0.3.3"
unstructured = "^0.5.9"
redis = "^4.5.4"
requests = "^2.28.2"
pymysql = "^1.0.3"
pymysqldb = "^0.0.2"
pyyaml = "^6.0"
pypdf = "^3.7.0"
sanic = {extras = ["ext"], version = "^23.3.0"}
mergedeep = "^1.3.4"
py-apollo = "^0.0.3"
aioredis = "^2.0.1"
more-itertools = "^9.1.0"
tenacity = "^8.2.2"
sqlalchemy = "^2.0.16"
cryptography = "^41.0.1"
aredis = "^1.1.8"
click = "^8.1.4"
google-cloud-texttospeech = "^2.14.1"
google-cloud-speech = "^2.21.0"
aiohttp = "^3.8.4"
gcloud-aio-storage = "^8.2.0"
aiokafka = "^0.8.1"
jinja2 = "^3.1.2"
async-lru = "^2.0.4"
sanic-jinja2 = "^2022.11.11"

[tool.poetry.dev-dependencies]
pylint = "*"


[tool.poetry.group.dev.dependencies]
pyramid = "^2.0.1"
black = "^23.3.0"
pytest = "^7.3.1"
pytest-asyncio = "^0.21.0"
pytest-sanic = "^1.9.1"
sanic-testing = "^23.3.0"



[[tool.poetry.source]]
name = "ali"
url = "http://mirrors.aliyun.com/pypi/simple/"
default = true
secondary = false

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = ["pydantic"]
ignored-modules = ["redis"]
disable=[
  'no-name-in-module'
]
ignored-classes=["Redis"]

[tool.pylint.'BASIC']
good-names = ["e", "i", "k", "v", "t", "tm", "mk", "mv"]

[tool.pytest.ini_options]
addopts = "-s"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
